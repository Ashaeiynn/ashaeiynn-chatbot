<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ask Your Guide — Admin</title>
<style>
  :root{--gold:#f7c948;--ink:#e9e4f2;--dim:#9d94b8;--bg:#0b0820;--card:#171232;--line:#2b2350}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(ellipse at 20% -10%,#1c1440 0%,var(--bg) 55%);min-height:100vh;
    font:15px/1.55 -apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;color:var(--ink);padding-bottom:60px}
  header{display:flex;align-items:center;gap:14px;padding:18px 22px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:rgba(11,8,32,.92);backdrop-filter:blur(8px);z-index:5}
  header img{width:40px;height:40px;filter:drop-shadow(0 0 8px rgba(247,201,72,.5))}
  header h1{font-size:19px;color:var(--gold);font-weight:600}
  header p{font-size:12.5px;color:var(--dim)}
  .spacer{flex:1}
  button{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:10px;padding:8px 14px;font-size:13.5px}
  button:hover{border-color:var(--gold)}
  main{max-width:880px;margin:0 auto;padding:20px 16px}
  /* stats */
  #stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:center}
  .stat b{display:block;font-size:22px;color:var(--gold)}
  .stat span{font-size:12px;color:var(--dim)}
  .stat.warn b{color:#ff9d76}
  /* controls */
  #controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
  .chip{border-radius:999px;padding:6px 14px;font-size:13px}
  .chip.on{background:var(--gold);color:#231a04;border-color:var(--gold);font-weight:600}
  #search{flex:1;min-width:160px;background:var(--card);border:1px solid var(--line);border-radius:999px;
    padding:8px 16px;color:var(--ink);font-size:13.5px;outline:none}
  #search:focus{border-color:var(--gold)}
  /* cards */
  .qa{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
  .qa.unanswered{border-color:#7a3c2a;background:#221226}
  .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11.5px;color:var(--dim);margin-bottom:8px}
  .badge{border:1px solid var(--line);border-radius:999px;padding:1px 9px}
  .badge.red{border-color:#a04a33;color:#ff9d76}
  .badge.goldb{border-color:rgba(247,201,72,.5);color:var(--gold)}
  .q{font-weight:600;margin-bottom:6px}
  .a{color:#cfc8e2;white-space:pre-wrap;max-height:110px;overflow:hidden;position:relative;cursor:pointer}
  .a.open{max-height:none}
  .a:not(.open).long::after{content:"… tap to read more";position:absolute;right:0;bottom:0;
    background:linear-gradient(90deg,transparent,var(--card) 30%);padding-left:40px;color:var(--gold);font-size:12px}
  .src{margin-top:8px;font-size:12px;color:var(--dim)}
  .empty{text-align:center;color:var(--dim);padding:50px 0}
  /* login */
  #login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:10}
  #login .box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px;width:min(90vw,360px);text-align:center}
  #login img{width:52px;margin-bottom:10px;filter:drop-shadow(0 0 10px rgba(247,201,72,.5))}
  #login h2{color:var(--gold);font-size:18px;margin-bottom:4px}
  #login p{font-size:13px;color:var(--dim);margin-bottom:16px}
  #pw{width:100%;background:#0e0a26;border:1px solid var(--line);border-radius:10px;padding:11px 14px;
    color:var(--ink);font-size:15px;outline:none;margin-bottom:12px;text-align:center}
  #pw:focus{border-color:var(--gold)}
  #go{width:100%;background:var(--gold);color:#231a04;font-weight:600;border:none;padding:11px}
  #lerr{color:#ff9d76;font-size:12.5px;margin-top:10px;min-height:16px}
</style>
</head>
<body>
<div id="login">
  <div class="box">
    <img src="/logo.png" alt="">
    <h2>Ask Your Guide — Admin</h2>
    <p>प्रश्न-उत्तर की समीक्षा · review what applicants ask</p>
    <input id="pw" type="password" placeholder="Admin password" autocomplete="current-password">
    <button id="go">Enter</button>
    <div id="lerr"></div>
  </div>
</div>

<header>
  <img src="/logo.png" alt="">
  <div><h1>Ask Your Guide — Admin</h1><p id="sub">loading…</p></div>
  <div class="spacer"></div>
  <button id="refresh">⟳ Refresh</button>
  <button id="logout">Logout</button>
</header>
<main>
  <div id="stats"></div>
  <div id="controls">
    <button class="chip on" data-f="all">All</button>
    <button class="chip" data-f="unanswered">Unanswered</button>
    <button class="chip" data-f="voice">🎙️ Voice</button>
    <button class="chip" data-f="text">⌨️ Typed</button>
    <button class="chip" data-f="hi">हिंदी</button>
    <button class="chip" data-f="en">English</button>
    <input id="search" placeholder="Search a question…">
  </div>
  <div id="list"></div>
</main>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  let entries = [], filter = "all", query = "";

  const isUnanswered = (e) => e.error || (e.answer && !/Source\s*:/.test(e.answer) && !e.testMode);
  const when = (iso) => new Date(iso).toLocaleString("en-IN",
    { timeZone: "Asia/Kolkata", day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });

  async function load() {
    const key = localStorage.getItem("adminKey") || "";
    const r = await fetch("/api/admin/logs", { headers: { "x-admin-key": key } });
    if (r.status === 401 || r.status === 501 || r.status === 429) {
      $("#login").style.display = "flex";
      $("#lerr").textContent = r.status === 429 ? "Too many attempts — wait a few minutes." :
        (key ? "Wrong password — try again." : "");
      return;
    }
    entries = (await r.json()).entries || [];
    $("#login").style.display = "none";
    render();
  }

  function render() {
    const today = new Date().toLocaleDateString("en-IN", { timeZone: "Asia/Kolkata" });
    const todayN = entries.filter((e) => new Date(e.at).toLocaleDateString("en-IN", { timeZone: "Asia/Kolkata" }) === today).length;
    const un = entries.filter(isUnanswered).length;
    const hiN = entries.filter((e) => e.hi).length;
    const vN = entries.filter((e) => e.via === "voice").length;
    $("#stats").innerHTML = `
      <div class="stat"><b>${entries.length}</b><span>total questions</span></div>
      <div class="stat"><b>${todayN}</b><span>today</span></div>
      <div class="stat"><b>${entries.length ? Math.round(hiN / entries.length * 100) : 0}%</b><span>in Hindi</span></div>
      <div class="stat"><b>${entries.length ? Math.round(vN / entries.length * 100) : 0}%</b><span>by voice</span></div>
      <div class="stat warn"><b>${un}</b><span>unanswered</span></div>`;
    $("#sub").textContent = `last ${entries.length} questions · newest first`;

    const q = query.toLowerCase();
    const shown = entries.filter((e) => {
      if (filter === "unanswered" && !isUnanswered(e)) return false;
      if (filter === "voice" && e.via !== "voice") return false;
      if (filter === "text" && e.via === "voice") return false;
      if (filter === "hi" && !e.hi) return false;
      if (filter === "en" && e.hi) return false;
      if (q && !(e.q || "").toLowerCase().includes(q) && !(e.answer || "").toLowerCase().includes(q)) return false;
      return true;
    });

    $("#list").innerHTML = shown.length ? "" : `<div class="empty">कोई प्रश्न नहीं मिला · nothing here yet</div>`;
    for (const e of shown.slice(0, 300)) {
      const card = document.createElement("div");
      card.className = "qa" + (isUnanswered(e) ? " unanswered" : "");
      const badges = [
        `<span class="badge">${e.via === "voice" ? "🎙️ voice" : "⌨️ typed"}</span>`,
        `<span class="badge">${e.hi ? "हिंदी" : "English"}</span>`,
        e.testMode ? `<span class="badge">test mode</span>` : "",
        e.error ? `<span class="badge red">⚠ ${e.error}</span>` : "",
        isUnanswered(e) && !e.error ? `<span class="badge red">no source — knowledge gap?</span>` : "",
      ].join("");
      const srcs = (e.top || []).map((t) => `${t.t} (${t.s})`).join(" · ");
      const aText = e.answer || (e.error ? "(no answer — the request failed)" : "(answer not recorded — older entry)");
      card.innerHTML = `
        <div class="meta"><span class="badge goldb">${when(e.at)}</span>${badges}</div>
        <div class="q">${esc(e.q)}</div>
        <div class="a${aText.length > 260 ? " long" : ""}">${esc(aText)}</div>
        ${srcs ? `<div class="src">📚 matched: ${esc(srcs)}</div>` : ""}`;
      card.querySelector(".a").addEventListener("click", (ev) => ev.currentTarget.classList.toggle("open"));
      $("#list").appendChild(card);
    }
  }

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  $("#go").addEventListener("click", () => { localStorage.setItem("adminKey", $("#pw").value.trim()); load(); });
  $("#pw").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#go").click(); });
  $("#refresh").addEventListener("click", load);
  $("#logout").addEventListener("click", () => { localStorage.removeItem("adminKey"); location.reload(); });
  document.querySelectorAll(".chip").forEach((c) => c.addEventListener("click", () => {
    document.querySelectorAll(".chip").forEach((x) => x.classList.remove("on"));
    c.classList.add("on"); filter = c.dataset.f; render();
  }));
  $("#search").addEventListener("input", (e) => { query = e.target.value; render(); });

  load();
  setInterval(() => { if ($("#login").style.display === "none") load(); }, 60000);
})();
</script>
</body>
</html>
